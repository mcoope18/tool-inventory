name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Generate the Android platform folder if it isn't committed yet.
      - name: Ensure Android project exists
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org com.mcoope18 --project-name tool_inventory .
          fi
          # flutter create adds a sample test we don't use
          rm -f test/widget_test.dart

      - name: Prepare signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          RAW_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::No signing key secret; using a temporary key"
            exit 0
          fi
          # Strip stray spaces/line breaks that sneak in when pasting.
          printf '%s' "$KEYSTORE_B64" | tr -d ' \r\n\t' | base64 -d > "$RUNNER_TEMP/upload.jks" || true
          PW=$(printf '%s' "$RAW_PASSWORD" | tr -d ' \r\n\t')
          echo "::add-mask::$PW"
          echo "Keystore file: $(stat -c%s "$RUNNER_TEMP/upload.jks") bytes (expected 2145)"
          echo "Password: ${#PW} characters (expected 32)"
          if keytool -list -keystore "$RUNNER_TEMP/upload.jks" -storepass "$PW" >/dev/null 2>&1; then
            echo "Signing key checks out"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$PW" >> "$GITHUB_ENV"
          else
            echo "::error::The signing key secrets don't match. Re-paste ANDROID_KEYSTORE_B64 and ANDROID_KEY_PASSWORD."
            exit 1
          fi

      - name: Patch Android project
        run: python3 tool/patch_android.py

      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter build apk --release

      - name: Publish APK as a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          body: Install on Android by opening this page on your phone and tapping the .apk file.
          files: build/app/outputs/flutter-apk/app-release.apk
