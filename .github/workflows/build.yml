name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Generate the Android platform folder if it isn't committed yet.
      - name: Ensure Android project exists
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org com.mcoope18 --project-name tool_inventory .
          fi

      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter build apk --release

      - name: Publish APK as a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          body: Install on Android by opening this page on your phone and tapping the .apk file.
          files: build/app/outputs/flutter-apk/app-release.apk
