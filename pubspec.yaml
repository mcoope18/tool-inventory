name: tool_inventory
description: Shop tool inventory — photos, voice, locations.
publish_to: 'none'
version: 0.5.0+6

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  image_picker: ^1.1.2
  path_provider: ^2.1.4
  google_mlkit_text_recognition: ^0.15.0
  speech_to_text: ^7.0.0
  share_plus: ^10.1.4
  image: ^4.2.0
  url_launcher: ^6.3.1
  google_mlkit_subject_segmentation: ^0.0.3
  firebase_core: '>=3.6.0 <6.0.0'
  firebase_auth: '>=5.3.0 <8.0.0'
  cloud_firestore: '>=5.4.0 <8.0.0'
  http: ^1.2.2
  firebase_storage: '>=12.3.0 <15.0.0'

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
